<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البلاغات - نظام إدارة النقل</title>
    <link rel="stylesheet" href="alerts.css">
</head>
<body>
    <!-- الشريط العلوي -->
    <header class="top-bar">
        <button class="btn-back" onclick="goBack()">←</button>
        <h1>🚨 البلاغات</h1>
        <div class="spacer"></div>
    </header>

    <!-- المحتوى -->
    <main class="container">
        
        <!-- الإحصائيات -->
        <div class="stats-bar">
            <div class="stat-box active">
                <div class="stat-number" id="openCount">0</div>
                <div class="stat-label">بلاغات مفتوحة</div>
            </div>
            <div class="stat-box resolved">
                <div class="stat-number" id="resolvedCount">0</div>
                <div class="stat-label">بلاغات مُعالجة</div>
            </div>
        </div>

        <!-- أزرار التصفية -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="open">المفتوحة</button>
            <button class="filter-btn" data-filter="resolved">المُعالجة</button>
            <button class="filter-btn" data-filter="all">الكل</button>
        </div>

        <!-- قائمة البلاغات -->
        <div id="alertsList" class="alerts-list">
            <!-- يتم تعبئتها بالجافاسكربت -->
        </div>

        <!-- حالة فاضية -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">✅</div>
            <h2>لا يوجد بلاغات</h2>
            <p id="emptyMessage">لا يوجد بلاغات مفتوحة حالياً</p>
        </div>

    </main>

    <!-- نافذة إنشاء طلب بديل -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">إنشاء طلب بديل</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- يتم تعبئتها بالجافاسكربت -->
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                <button class="btn-confirm" id="modalConfirmBtn">تأكيد</button>
            </div>
        </div>
    </div>

    <script src="alerts.js"></script>
</body>
</html>
