<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - نظام إدارة النقل</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #f3f4f6;
            display: block;
            padding: 0;
            align-items: initial;
            justify-content: initial;
        }
        .dashboard {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .welcome-card {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: #fff;
            border-radius: 20px;
            padding: 30px 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.3);
        }
        .welcome-card h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .welcome-card .role-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        .welcome-card .time {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 8px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin: 20px 0 12px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .menu-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
        }
        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
            border-color: #3b82f6;
        }
        .menu-card .icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .menu-card .title {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
        }
        .menu-card .desc {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        /* شارة البلاغات */
        .alert-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 50px;
            min-width: 22px;
            text-align: center;
            animation: pulse-badge 1.5s infinite;
            display: none;
        }
        .alert-badge.show {
            display: block;
        }
        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .btn-logout {
            display: block;
            width: 100%;
            padding: 14px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        @media (max-width: 480px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="welcome-card">
            <h1>مرحبًا، <span id="userName">المستخدم</span> 👋</h1>
            <div class="role-badge">
                <span id="userRole">الدور</span>
            </div>
            <div class="time" id="loginTime">وقت الدخول:</div>
        </div>

        <h2 class="section-title">📋 القائمة الرئيسية</h2>

        <div class="menu-grid">
            <a class="menu-card" href="add-request.html">
                <div class="icon">📝</div>
                <div class="title">إضافة طلب نقل</div>
                <div class="desc">إنشاء طلب جديد</div>
            </a>

            <a class="menu-card" href="approve-requests.html">
                <div class="icon">✅</div>
                <div class="title">اعتماد الطلبات</div>
                <div class="desc">مراجعة واعتماد</div>
            </a>

            <a class="menu-card" href="alerts.html">
                <div class="alert-badge" id="alertBadge">0</div>
                <div class="icon">🚨</div>
                <div class="title">البلاغات</div>
                <div class="desc">أعطال وحوادث</div>
            </a>

            <a class="menu-card" href="requests.html">
                <div class="icon">📅</div>
                <div class="title">جدول الرحلات</div>
                <div class="desc">عرض الرحلات</div>
            </a>

            <a class="menu-card" href="driver.html">
                <div class="icon">🚙</div>
                <div class="title">رحلاتي</div>
                <div class="desc">رحلات السائق</div>
            </a>

            <a class="menu-card" href="#">
                <div class="icon">🚗</div>
                <div class="title">المركبات</div>
                <div class="desc">إدارة المركبات</div>
            </a>

            <a class="menu-card" href="#">
                <div class="icon">👤</div>
                <div class="title">السائقون</div>
                <div class="desc">إدارة السائقين</div>
            </a>

            <a class="menu-card" href="#">
                <div class="icon">📊</div>
                <div class="title">التقارير</div>
                <div class="desc">إحصائيات وتقارير</div>
            </a>
        </div>

        <button class="btn-logout" onclick="logout()">
            🚪 تسجيل الخروج
        </button>
    </div>

    <script>
        const currentUserStr = localStorage.getItem('currentUser');

        if (!currentUserStr) {
            window.location.href = 'login.html';
        } else {
            const currentUser = JSON.parse(currentUserStr);

            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userRole').textContent = currentUser.roleLabel;

            const loginDate = new Date(currentUser.loginTime);
            const formattedTime = loginDate.toLocaleString('ar-SA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('loginTime').textContent = 'وقت الدخول: ' + formattedTime;

            // حساب عدد البلاغات المفتوحة
            const allRequests = JSON.parse(localStorage.getItem('transportRequests') || '[]');
            const openAlerts = allRequests.filter(r => r.status === 'issue_reported').length;
            
            const badge = document.getElementById('alertBadge');
            if (openAlerts > 0) {
                badge.textContent = openAlerts;
                badge.classList.add('show');
            }
        }

        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
