<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وجدولة النقل</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p {
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.9;
            margin-bottom: 25px;
        }
        .status {
            display: inline-block;
            background: #10b981;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .footer {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚗</div>
        <div class="status">✅ الموقع يعمل بنجاح</div>
        <h1>نظام إدارة وجدولة النقل</h1>
        <p>
            مرحباً بك في النظام. هذا النموذج الأولي جاهز للتطوير.<br>
            سنضيف قريباً: تسجيل الدخول، إدارة الطلبات، الاعتماد، ومتابعة الرحلات.
        </p>
        <div class="footer">
            Transport Management & Scheduling System<br>
            الإصدار التجريبي الأول
        </div>
    </div>
</body>
</html>
