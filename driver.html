<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلاتي - نظام إدارة النقل</title>
    <link rel="stylesheet" href="driver.css">
</head>
<body>
    <!-- الشريط العلوي -->
    <header class="top-bar">
        <button class="btn-back" onclick="goBack()">←</button>
        <h1>رحلاتي</h1>
        <div class="spacer"></div>
    </header>

    <!-- المحتوى -->
    <main class="container">
        
        <!-- بطاقة الترحيب -->
        <div class="welcome-card">
            <div class="welcome-icon">👤</div>
            <div class="welcome-info">
                <h2 id="driverName">السائق</h2>
                <p id="driverId">رقم الموظف: -</p>
            </div>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-bar">
            <div class="stat-box active">
                <div class="stat-number" id="activeCount">0</div>
                <div class="stat-label">رحلات نشطة</div>
            </div>
            <div class="stat-box completed">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">رحلات مكتملة</div>
            </div>
        </div>

        <!-- أزرار التصفية -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="active">الرحلات النشطة</button>
            <button class="filter-btn" data-filter="completed">المكتملة</button>
            <button class="filter-btn" data-filter="all">الكل</button>
        </div>

        <!-- قائمة الرحلات -->
        <div id="tripsList" class="trips-list">
            <!-- يتم تعبئتها بالجافاسكربت -->
        </div>

        <!-- حالة فاضية -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">🚗</div>
            <h2>لا يوجد رحلات</h2>
            <p id="emptyMessage">لا يوجد رحلات مسندة إليك حالياً</p>
        </div>

    </main>

    <!-- نافذة تأكيد -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">تأكيد</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- يتم تعبئتها بالجافاسكربت -->
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                <button class="btn-confirm" id="modalConfirmBtn">تأكيد</button>
            </div>
        </div>
    </div>

    <script src="driver.js"></script>
</body>
</html>
