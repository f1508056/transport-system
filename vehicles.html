<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركبات - نظام إدارة النقل</title>
    <link rel="stylesheet" href="vehicles.css">
</head>
<body>
    <!-- الشريط العلوي -->
    <header class="top-bar">
        <button class="btn-back" onclick="goBack()">←</button>
        <h1>🚗 المركبات</h1>
        <div class="spacer"></div>
    </header>

    <!-- المحتوى -->
    <main class="container">
        
        <!-- الإحصائيات -->
        <div class="stats-bar">
            <div class="stat-box total">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">إجمالي</div>
            </div>
            <div class="stat-box available">
                <div class="stat-number" id="availableCount">0</div>
                <div class="stat-label">متاحة</div>
            </div>
            <div class="stat-box inuse">
                <div class="stat-number" id="inUseCount">0</div>
                <div class="stat-label">مستخدمة</div>
            </div>
            <div class="stat-box maintenance">
                <div class="stat-number" id="maintenanceCount">0</div>
                <div class="stat-label">صيانة</div>
            </div>
        </div>

        <!-- زر إضافة مركبة -->
        <button class="btn-add-new" onclick="openAddModal()">
            ➕ إضافة مركبة جديدة
        </button>

        <!-- البحث والتصفية -->
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="🔍 ابحث برقم المركبة أو اللوحة..."
            >
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="Available">متاحة</button>
            <button class="filter-btn" data-filter="In Use">مستخدمة</button>
            <button class="filter-btn" data-filter="Maintenance">صيانة</button>
            <button class="filter-btn" data-filter="Out of Service">خارج الخدمة</button>
        </div>

        <!-- قائمة المركبات -->
        <div id="vehiclesList" class="vehicles-list">
            <!-- يتم تعبئتها بالجافاسكربت -->
        </div>

        <!-- حالة فاضية -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">🚗</div>
            <h2>لا يوجد مركبات</h2>
            <p>ابدأ بإضافة مركبة جديدة</p>
        </div>

    </main>

    <!-- نافذة الإضافة / التعديل -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">إضافة مركبة جديدة</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- يتم تعبئتها بالجافاسكربت -->
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                <button class="btn-confirm" id="modalConfirmBtn">حفظ</button>
            </div>
        </div>
    </div>

    <script src="vehicles.js"></script>
</body>
</html>
