<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المركبات - نظام إدارة النقل</title>
    <link rel="stylesheet" href="vehicle-history.css">
</head>
<body>
    <!-- الشريط العلوي -->
    <header class="top-bar">
        <button class="btn-back" onclick="goBack()">←</button>
        <h1>🔍 سجل المركبات</h1>
        <div class="spacer"></div>
    </header>

    <!-- المحتوى -->
    <main class="container">
        
        <!-- اختيار المركبة -->
        <div class="selector-card">
            <label class="selector-label">📋 اختر المركبة:</label>
            <select id="vehicleSelect" class="vehicle-select">
                <option value="">-- اختر مركبة --</option>
            </select>
        </div>

        <!-- منطقة البحث (تظهر بعد اختيار مركبة) -->
        <div id="searchArea" class="search-area" style="display: none;">
            
            <!-- البحث بتاريخ ووقت -->
            <div class="search-card">
                <div class="search-title">🔍 البحث بتاريخ ووقت</div>
                <div class="search-row">
                    <div class="search-field">
                        <label>📅 التاريخ</label>
                        <input type="date" id="searchDate">
                    </div>
                    <div class="search-field">
                        <label>🕐 الوقت</label>
                        <input type="time" id="searchTime">
                    </div>
                </div>
                <button class="btn-search" onclick="searchByDateTime()">
                    🔍 ابحث
                </button>
            </div>

            <!-- نتيجة البحث -->
            <div id="searchResult" class="search-result" style="display: none;"></div>

            <!-- الإحصائيات -->
            <div class="stats-card">
                <div class="stats-title">📊 إحصائيات المركبة</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number" id="totalTrips">0</div>
                        <div class="stat-label">إجمالي الرحلات</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="totalDistance">0</div>
                        <div class="stat-label">إجمالي المسافة (كم)</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="driversCount">0</div>
                        <div class="stat-label">عدد السائقين</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="lastUsed">-</div>
                        <div class="stat-label">آخر استخدام</div>
                    </div>
                </div>
            </div>

            <!-- سجل الرحلات -->
            <div class="history-header">
                <h2 class="history-title">📜 سجل الرحلات</h2>
                <div class="history-filter">
                    <button class="filter-btn active" data-filter="all">الكل</button>
                    <button class="filter-btn" data-filter="completed">مكتملة</button>
                    <button class="filter-btn" data-filter="cancelled">ملغاة</button>
                    <button class="filter-btn" data-filter="issue">بها عطل</button>
                </div>
            </div>

            <div id="tripsList" class="trips-list"></div>

            <!-- حالة فاضية -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">🚗</div>
                <h2>لا يوجد رحلات</h2>
                <p id="emptyMessage">لم تُسجل أي رحلة لهذه المركبة</p>
            </div>

        </div>

        <!-- حالة البداية -->
        <div id="initialState" class="initial-state">
            <div class="initial-icon">🚗</div>
            <h2>اختر مركبة للبدء</h2>
            <p>ستشاهد سجل الرحلات والإحصائيات</p>
        </div>

    </main>

    <script src="vehicle-history.js"></script>
</body>
</html>
